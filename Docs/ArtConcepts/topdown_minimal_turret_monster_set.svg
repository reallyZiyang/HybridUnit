<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#eef0f2"/>

  <!-- Top row: turrets. Each turret is designed as two parts only:
       base + barrel. Runtime aiming rotates the barrel pivot. -->

  <!-- 01 Gatling turret -->
  <g id="turret_gatling" transform="translate(180 190)">
    <g id="base">
      <circle cx="0" cy="0" r="84" fill="#26313b" stroke="#11171d" stroke-width="8"/>
      <polygon points="0,-64 54,-28 54,42 0,68 -54,42 -54,-28" fill="#34414d"/>
      <circle cx="0" cy="0" r="26" fill="#151b21"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect x="10" y="-22" width="118" height="14" rx="3" fill="#202932" stroke="#11171d" stroke-width="5"/>
      <rect x="10" y="8" width="118" height="14" rx="3" fill="#202932" stroke="#11171d" stroke-width="5"/>
      <rect x="118" y="-28" width="28" height="56" rx="4" fill="#4c5c6b" stroke="#11171d" stroke-width="5"/>
    </g>
  </g>

  <!-- 02 Cannon turret -->
  <g id="turret_cannon" transform="translate(455 190)">
    <g id="base">
      <polygon points="0,-88 62,-62 88,0 62,62 0,88 -62,62 -88,0 -62,-62" fill="#353928" stroke="#15170f" stroke-width="8"/>
      <circle cx="0" cy="0" r="54" fill="#4a5036"/>
      <circle cx="0" cy="0" r="24" fill="#181a12"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect x="8" y="-28" width="132" height="56" rx="8" fill="#313526" stroke="#15170f" stroke-width="7"/>
      <rect x="120" y="-18" width="34" height="36" rx="4" fill="#c6a23a" stroke="#15170f" stroke-width="5"/>
    </g>
  </g>

  <!-- 03 Laser turret -->
  <g id="turret_laser" transform="translate(730 190)">
    <g id="base">
      <circle cx="0" cy="0" r="82" fill="#252a40" stroke="#11131c" stroke-width="8"/>
      <rect x="-54" y="-54" width="108" height="108" rx="10" fill="#343a56"/>
      <circle cx="0" cy="0" r="24" fill="#151622"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect x="8" y="-18" width="120" height="36" rx="6" fill="#252a3f" stroke="#11131c" stroke-width="7"/>
      <circle cx="136" cy="0" r="24" fill="#46d7ff" stroke="#11131c" stroke-width="6"/>
      <circle cx="136" cy="0" r="8" fill="#e6fbff"/>
    </g>
  </g>

  <!-- 04 Rocket turret -->
  <g id="turret_rocket" transform="translate(1005 190)">
    <g id="base">
      <polygon points="0,-86 74,-42 74,42 0,86 -74,42 -74,-42" fill="#3a332d" stroke="#171310" stroke-width="8"/>
      <polygon points="0,-58 48,-28 48,28 0,58 -48,28 -48,-28" fill="#55483e"/>
      <circle cx="0" cy="0" r="22" fill="#1a1715"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect x="8" y="-34" width="128" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
      <rect x="8" y="6" width="128" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
      <rect x="118" y="-38" width="32" height="76" rx="5" fill="#665548" stroke="#171310" stroke-width="5"/>
    </g>
  </g>

  <!-- 05 Tesla turret. Still two parts: base + top emitter. It does not need target-facing rotation. -->
  <g id="turret_tesla" transform="translate(1245 190)">
    <g id="base">
      <circle cx="0" cy="0" r="80" fill="#2d293b" stroke="#121019" stroke-width="8"/>
      <polygon points="0,-62 48,-28 48,34 0,66 -48,34 -48,-28" fill="#3c3650"/>
      <circle cx="0" cy="0" r="22" fill="#17151e"/>
    </g>
    <g id="barrel">
      <rect x="-16" y="-104" width="32" height="74" rx="5" fill="#2a2738" stroke="#121019" stroke-width="6"/>
      <circle cx="0" cy="-118" r="28" fill="#9b6dff" stroke="#121019" stroke-width="6"/>
    </g>
  </g>

  <!-- Bottom row: monsters. Each monster is one Sprite part only. No animation required. -->

  <!-- 01 Core disk monster -->
  <g id="monster_core_disk" transform="translate(215 525)">
    <circle cx="0" cy="0" r="82" fill="#243039" stroke="#11171d" stroke-width="8"/>
    <polygon points="0,-58 52,-20 34,48 -34,48 -52,-20" fill="#313d48"/>
    <circle cx="0" cy="0" r="24" fill="#35c7b7" stroke="#11171d" stroke-width="6"/>
  </g>

  <!-- 02 Hex shell monster -->
  <g id="monster_hex_shell" transform="translate(485 525)">
    <polygon points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44" fill="#30343c" stroke="#121419" stroke-width="8"/>
    <polygon points="-40,-48 36,-58 62,0 28,58 -50,42 -64,-14" fill="#3d4450"/>
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="#d3a22d" stroke="#15120a" stroke-width="6"/>
  </g>

  <!-- 03 Blob marker monster -->
  <g id="monster_blob_marker" transform="translate(755 525)">
    <path d="M-88 30 C-78 -54 -24 -92 44 -70 C94 -54 106 16 70 62 C18 88 -58 74 -88 30 Z" fill="#2f3a34" stroke="#141a17" stroke-width="8"/>
    <path d="M-46 24 C-40 -28 8 -50 48 -30 C70 -18 70 20 44 42 C12 60 -32 50 -46 24 Z" fill="#3d4a42"/>
    <circle cx="-10" cy="0" r="20" fill="#8be04f" stroke="#11170f" stroke-width="6"/>
  </g>

  <!-- 04 Spore disk monster -->
  <g id="monster_spore_disk" transform="translate(1025 525)">
    <circle cx="0" cy="0" r="78" fill="#2b3038" stroke="#11161b" stroke-width="8"/>
    <polygon points="-48,-38 42,-46 62,20 4,62 -58,24" fill="#38404a"/>
    <circle cx="-8" cy="0" r="22" fill="#8d63ff" stroke="#151022" stroke-width="6"/>
  </g>

  <!-- 05 Simple armor square monster -->
  <g id="monster_armor_square" transform="translate(1265 525)">
    <rect x="-78" y="-78" width="156" height="156" rx="14" fill="#352d2d" stroke="#171313" stroke-width="8"/>
    <polygon points="-42,-54 54,-38 42,54 -54,42" fill="#493c3c"/>
    <circle cx="0" cy="0" r="22" fill="#ef7845" stroke="#171313" stroke-width="6"/>
  </g>
</svg>
