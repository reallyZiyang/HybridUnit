<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <rect width="1400" height="420" fill="#eef0f2"/>

  <!-- Aimable side-view turret concepts.
       Flat colors only. Rotating weapon groups are drawn around an explicit pivot. -->

  <!-- 01 Gatling: base fixed, weapon_pivot rotates -->
  <g id="gatling_aimable" transform="translate(145 240)">
    <ellipse cx="0" cy="70" rx="104" ry="22" fill="#151b21"/>
    <rect x="-92" y="30" width="184" height="46" rx="6" fill="#27313b" stroke="#11171d" stroke-width="7"/>
    <polygon points="-62,30 -34,-2 50,-2 80,30" fill="#354351" stroke="#11171d" stroke-width="7"/>
    <g id="gatling_weapon_pivot" transform="translate(-28 10) rotate(-12)">
      <circle cx="0" cy="0" r="25" fill="#4a5a6b" stroke="#11171d" stroke-width="6"/>
      <rect x="-118" y="-28" width="128" height="14" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
      <rect x="-124" y="-7" width="138" height="14" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
      <rect x="-118" y="14" width="128" height="14" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
      <polygon points="-152,-10 -128,-24 -128,22 -152,10" fill="#53bfd3"/>
    </g>
  </g>

  <!-- 02 Cannon: base fixed, cannon rotates -->
  <g id="grenade_aimable" transform="translate(425 240)">
    <ellipse cx="0" cy="70" rx="104" ry="22" fill="#191a13"/>
    <rect x="-92" y="32" width="184" height="44" rx="6" fill="#343829" stroke="#15170f" stroke-width="7"/>
    <polygon points="-62,32 -34,0 56,0 82,32" fill="#4a5036" stroke="#15170f" stroke-width="7"/>
    <g id="grenade_weapon_pivot" transform="translate(-24 10) rotate(10)">
      <circle cx="0" cy="0" r="28" fill="#5d6442" stroke="#15170f" stroke-width="6"/>
      <rect x="-126" y="-18" width="132" height="44" rx="8" fill="#313526" stroke="#15170f" stroke-width="7"/>
      <rect x="-150" y="-8" width="30" height="24" rx="3" fill="#c6a23a" stroke="#15170f" stroke-width="5"/>
    </g>
  </g>

  <!-- 03 Laser: emitter arm rotates, beam anchor at muzzle -->
  <g id="laser_aimable" transform="translate(705 240)">
    <ellipse cx="0" cy="70" rx="98" ry="22" fill="#151622"/>
    <rect x="-84" y="34" width="168" height="42" rx="6" fill="#262b40" stroke="#11131c" stroke-width="7"/>
    <polygon points="-52,34 -24,4 56,4 78,34" fill="#343a56" stroke="#11131c" stroke-width="7"/>
    <g id="laser_weapon_pivot" transform="translate(-18 10) rotate(-22)">
      <circle cx="0" cy="0" r="26" fill="#444c70" stroke="#11131c" stroke-width="6"/>
      <rect x="-116" y="-15" width="128" height="30" rx="5" fill="#252a3f" stroke="#11131c" stroke-width="7"/>
      <circle cx="-120" cy="0" r="18" fill="#46d7ff" stroke="#11131c" stroke-width="6"/>
      <circle cx="-120" cy="0" r="7" fill="#e6fbff"/>
    </g>
  </g>

  <!-- 04 Rocket: launcher pod rotates as one block -->
  <g id="rocket_aimable" transform="translate(985 240)">
    <ellipse cx="0" cy="70" rx="104" ry="22" fill="#1a1715"/>
    <rect x="-92" y="32" width="184" height="44" rx="6" fill="#3a332d" stroke="#171310" stroke-width="7"/>
    <polygon points="-58,32 -30,0 58,0 86,32" fill="#55483e" stroke="#171310" stroke-width="7"/>
    <g id="rocket_weapon_pivot" transform="translate(-20 8) rotate(-8)">
      <circle cx="0" cy="0" r="26" fill="#665548" stroke="#171310" stroke-width="6"/>
      <rect x="-120" y="-34" width="134" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
      <rect x="-120" y="6" width="134" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
      <polygon points="-152,-24 -128,-38 -128,-10" fill="#ef7845"/>
      <polygon points="-152,16 -128,2 -128,30" fill="#efb245"/>
    </g>
  </g>

  <!-- 05 Tesla/AOE: no target-facing barrel, only idle pulse/spark animation -->
  <g id="tesla_no_aim" transform="translate(1265 240)">
    <ellipse cx="0" cy="70" rx="96" ry="22" fill="#17151e"/>
    <rect x="-84" y="34" width="168" height="42" rx="6" fill="#2d293b" stroke="#121019" stroke-width="7"/>
    <polygon points="-52,34 -26,-4 52,-4 78,34" fill="#3c3650" stroke="#121019" stroke-width="7"/>
    <rect x="-20" y="-64" width="40" height="86" rx="5" fill="#2a2738" stroke="#121019" stroke-width="6"/>
    <rect x="-42" y="-56" width="84" height="16" rx="3" fill="#5d5276" stroke="#121019" stroke-width="5"/>
    <rect x="-42" y="-28" width="84" height="16" rx="3" fill="#5d5276" stroke="#121019" stroke-width="5"/>
    <circle cx="0" cy="-80" r="24" fill="#9b6dff" stroke="#121019" stroke-width="6"/>
    <polygon points="-52,-94 -30,-102 -36,-80" fill="#d3c3ff"/>
    <polygon points="48,-98 30,-110 32,-84" fill="#d3c3ff"/>
  </g>
</svg>
