<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#eef0f2"/>

  <!-- Recolorable top-down minimal set.
       Palette intentionally uses grayscale only:
       dark outline + light body + mid gray inner shape.
       Runtime tint can recolor the whole sprite cleanly. -->

  <defs>
    <style>
      .outline { fill: #171b20; }
      .main { fill: #e8edf1; }
      .mid { fill: #9faab3; }
      .darkmid { fill: #56616b; }
    </style>
  </defs>

  <!-- Turret 01: Gatling, base + barrel -->
  <g id="turret_gatling" transform="translate(160 170)">
    <g id="base">
      <circle class="outline" cx="0" cy="0" r="76"/>
      <circle class="main" cx="0" cy="0" r="64"/>
      <polygon class="mid" points="0,-44 38,-22 38,26 0,48 -38,26 -38,-22"/>
      <circle class="outline" cx="0" cy="0" r="18"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect class="outline" x="14" y="-28" width="122" height="18" rx="3"/>
      <rect class="outline" x="14" y="10" width="122" height="18" rx="3"/>
      <rect class="mid" x="20" y="-22" width="106" height="8" rx="2"/>
      <rect class="mid" x="20" y="16" width="106" height="8" rx="2"/>
      <rect class="outline" x="112" y="-34" width="34" height="68" rx="5"/>
      <rect class="darkmid" x="120" y="-24" width="18" height="48" rx="3"/>
    </g>
  </g>

  <!-- Turret 02: Cannon, base + barrel -->
  <g id="turret_cannon" transform="translate(420 170)">
    <g id="base">
      <polygon class="outline" points="0,-80 58,-58 80,0 58,58 0,80 -58,58 -80,0 -58,-58"/>
      <polygon class="main" points="0,-66 48,-48 66,0 48,48 0,66 -48,48 -66,0 -48,-48"/>
      <circle class="mid" cx="0" cy="0" r="38"/>
      <circle class="outline" cx="0" cy="0" r="18"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect class="outline" x="10" y="-32" width="138" height="64" rx="8"/>
      <rect class="main" x="22" y="-22" width="108" height="44" rx="5"/>
      <rect class="outline" x="130" y="-22" width="28" height="44" rx="4"/>
      <rect class="mid" x="136" y="-14" width="14" height="28" rx="2"/>
    </g>
  </g>

  <!-- Turret 03: Rail/Laser, base + barrel -->
  <g id="turret_rail" transform="translate(680 170)">
    <g id="base">
      <circle class="outline" cx="0" cy="0" r="74"/>
      <rect class="main" x="-52" y="-52" width="104" height="104" rx="8"/>
      <rect class="mid" x="-34" y="-34" width="68" height="68" rx="6"/>
      <circle class="outline" cx="0" cy="0" r="17"/>
    </g>
    <g id="barrel" transform="rotate(-90)">
      <rect class="outline" x="14" y="-24" width="132" height="48" rx="6"/>
      <rect class="main" x="24" y="-14" width="100" height="28" rx="3"/>
      <circle class="outline" cx="146" cy="0" r="24"/>
      <circle class="mid" cx="146" cy="0" r="13"/>
    </g>
  </g>

  <!-- Turret 04: Pulse/Tesla, no aiming required, still base + emitter -->
  <g id="turret_pulse" transform="translate(940 170)">
    <g id="base">
      <circle class="outline" cx="0" cy="0" r="74"/>
      <circle class="main" cx="0" cy="0" r="62"/>
      <polygon class="mid" points="0,-42 36,-18 36,30 0,52 -36,30 -36,-18"/>
      <circle class="outline" cx="0" cy="0" r="18"/>
    </g>
    <g id="barrel">
      <rect class="outline" x="-17" y="-124" width="34" height="78" rx="5"/>
      <rect class="darkmid" x="-9" y="-114" width="18" height="58" rx="3"/>
      <circle class="outline" cx="0" cy="-134" r="30"/>
      <circle class="main" cx="0" cy="-134" r="20"/>
    </g>
  </g>

  <!-- Monster 01: one part -->
  <g id="monster_disk" transform="translate(210 445)">
    <circle class="outline" cx="0" cy="0" r="76"/>
    <circle class="main" cx="0" cy="0" r="64"/>
    <polygon class="mid" points="0,-42 42,-14 28,42 -28,42 -42,-14"/>
    <circle class="outline" cx="0" cy="0" r="18"/>
  </g>

  <!-- Monster 02: one part -->
  <g id="monster_hex" transform="translate(470 445)">
    <polygon class="outline" points="0,-78 68,-40 68,40 0,78 -68,40 -68,-40"/>
    <polygon class="main" points="0,-64 56,-32 56,32 0,64 -56,32 -56,-32"/>
    <polygon class="mid" points="-28,-34 38,-26 42,34 -34,42 -48,-8"/>
    <rect class="outline" x="-16" y="-16" width="32" height="32" rx="3"/>
  </g>

  <!-- Monster 03: one part -->
  <g id="monster_blob" transform="translate(730 445)">
    <path class="outline" d="M-76 26 C-66 -48 -12 -82 48 -56 C88 -38 94 22 58 58 C12 86 -54 70 -76 26 Z"/>
    <path class="main" d="M-62 22 C-54 -36 -10 -62 38 -42 C70 -28 76 18 48 46 C12 66 -40 56 -62 22 Z"/>
    <path class="mid" d="M-28 12 C-24 -20 6 -34 32 -20 C48 -12 50 14 30 28 C10 40 -20 34 -28 12 Z"/>
    <circle class="outline" cx="4" cy="4" r="15"/>
  </g>

  <!-- Monster 04: one part -->
  <g id="monster_square" transform="translate(990 445)">
    <rect class="outline" x="-72" y="-72" width="144" height="144" rx="12"/>
    <rect class="main" x="-58" y="-58" width="116" height="116" rx="8"/>
    <polygon class="mid" points="-28,-38 42,-26 34,42 -38,32"/>
    <circle class="outline" cx="0" cy="0" r="18"/>
  </g>
</svg>
