<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <rect width="1500" height="980" fill="#eef0f2"/>

  <!--
    Top-down recolorable combat concept sheet v5.
    All units/effects face RIGHT.
    Projectiles are outline-only transparent shapes.
    Gray palette supports runtime tinting.
  -->

  <defs>
    <style>
      .outline { fill: #171b20; }
      .main { fill: #e7ecef; }
      .mid { fill: #9ca6ae; }
      .darkmid { fill: #59636c; }
      .fx { fill: #ffffff; }
      .fxmid { fill: #bfc7ce; }
      .projectile { fill: none; stroke: #171b20; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #171b20; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin2 { stroke: #9ca6ae; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 01 Machine gun turret: single barrel, fast single-target, recoil -->
  <g id="machine_gun_turret_row" transform="translate(145 110)">
    <g id="machine_gun_turret">
      <circle class="outline" cx="0" cy="0" r="70"/>
      <circle class="main" cx="0" cy="0" r="58"/>
      <polygon class="mid" points="0,-40 40,-18 40,24 0,46 -40,24 -40,-18"/>
      <circle class="outline" cx="0" cy="0" r="20"/>
      <g id="barrel">
        <rect class="outline" x="-16" y="-26" width="48" height="52" rx="8"/>
        <rect class="darkmid" x="-4" y="-16" width="24" height="32" rx="4"/>
        <rect class="outline" x="24" y="-13" width="102" height="26" rx="6"/>
        <rect class="main" x="36" y="-6" width="64" height="12" rx="3"/>
        <rect class="outline" x="114" y="-18" width="22" height="36" rx="4"/>
      </g>
    </g>
    <g id="machine_gun_projectile" transform="translate(245 0)">
      <ellipse class="projectile" cx="18" cy="0" rx="28" ry="10"/>
      <path class="thin2" d="M-62 -16 L-24 -16"/>
      <path class="thin2" d="M-80 16 L-34 16"/>
    </g>
    <g id="machine_gun_impact" transform="translate(385 0)">
      <circle class="outline" cx="0" cy="0" r="22"/>
      <circle class="fx" cx="0" cy="0" r="12"/>
      <polygon class="fxmid" points="22,0 48,-14 40,0 48,14"/>
    </g>
  </g>

  <!-- 02 Grenade turret: single barrel, slow AOE, recoil -->
  <g id="grenade_turret_row" transform="translate(145 260)">
    <g id="grenade_turret">
      <polygon class="outline" points="0,-76 56,-56 76,0 56,56 0,76 -56,56 -76,0 -56,-56"/>
      <polygon class="main" points="0,-62 46,-46 62,0 46,46 0,62 -46,46 -62,0 -46,-46"/>
      <circle class="mid" cx="0" cy="0" r="40"/>
      <circle class="outline" cx="0" cy="0" r="22"/>
      <g id="barrel">
        <rect class="outline" x="-22" y="-36" width="62" height="72" rx="10"/>
        <rect class="darkmid" x="-8" y="-24" width="34" height="48" rx="5"/>
        <rect class="outline" x="28" y="-29" width="84" height="58" rx="9"/>
        <rect class="main" x="40" y="-18" width="48" height="36" rx="5"/>
        <rect class="outline" x="102" y="-23" width="30" height="46" rx="4"/>
      </g>
    </g>
    <g id="grenade_projectile" transform="translate(245 0)">
      <circle class="projectile" cx="0" cy="0" r="24"/>
      <rect class="projectile" x="-14" y="-5" width="28" height="10" rx="3"/>
      <path class="thin2" d="M-82 24 C-52 -26 -20 -42 22 -30"/>
    </g>
    <g id="grenade_explosion" transform="translate(390 0)">
      <polygon class="outline" points="0,-56 18,-20 56,-30 30,0 58,30 18,22 0,58 -18,22 -58,30 -30,0 -56,-30 -18,-20"/>
      <polygon class="fx" points="0,-34 10,-12 34,-18 18,0 34,18 10,12 0,34 -10,12 -34,18 -18,0 -34,-18 -10,-12"/>
    </g>
  </g>

  <!-- 03 Laser turret: single barrel, piercing, sustained 1 second -->
  <g id="laser_turret_row" transform="translate(145 410)">
    <g id="laser_turret">
      <circle class="outline" cx="0" cy="0" r="72"/>
      <rect class="main" x="-50" y="-50" width="100" height="100" rx="10"/>
      <rect class="mid" x="-32" y="-32" width="64" height="64" rx="6"/>
      <circle class="outline" cx="0" cy="0" r="21"/>
      <g id="barrel">
        <rect class="outline" x="-20" y="-28" width="52" height="56" rx="8"/>
        <rect class="darkmid" x="-8" y="-18" width="28" height="36" rx="4"/>
        <rect class="outline" x="24" y="-18" width="98" height="36" rx="6"/>
        <rect class="main" x="36" y="-8" width="56" height="16" rx="3"/>
        <polygon class="outline" points="116,-30 152,0 116,30"/>
        <circle class="mid" cx="116" cy="0" r="12"/>
      </g>
    </g>
    <g id="laser_beam" transform="translate(240 0)">
      <rect class="projectile" x="-12" y="-16" width="300" height="32" rx="4"/>
      <path class="thin2" d="M28 -36 L74 -36"/>
      <path class="thin2" d="M126 36 L182 36"/>
      <path class="thin2" d="M220 -36 L276 -36"/>
    </g>
  </g>

  <!-- 04 Gatling turret: compact three barrels, extremely fast -->
  <g id="gatling_turret_row" transform="translate(145 560)">
    <g id="gatling_turret">
      <circle class="outline" cx="0" cy="0" r="78"/>
      <circle class="main" cx="0" cy="0" r="66"/>
      <polygon class="mid" points="0,-48 44,-24 44,30 0,54 -44,30 -44,-24"/>
      <circle class="outline" cx="0" cy="0" r="23"/>
      <g id="barrel">
        <rect class="outline" x="-24" y="-34" width="52" height="68" rx="8"/>
        <rect class="darkmid" x="-10" y="-22" width="24" height="44" rx="4"/>
        <rect class="outline" x="22" y="-24" width="78" height="12" rx="3"/>
        <rect class="outline" x="28" y="-6" width="84" height="12" rx="3"/>
        <rect class="outline" x="22" y="12" width="78" height="12" rx="3"/>
        <rect class="mid" x="34" y="-20" width="44" height="5" rx="2"/>
        <rect class="mid" x="40" y="-2" width="48" height="5" rx="2"/>
        <rect class="mid" x="34" y="16" width="44" height="5" rx="2"/>
        <rect class="outline" x="94" y="-29" width="26" height="58" rx="4"/>
      </g>
    </g>
    <g id="gatling_spin_and_bullets" transform="translate(245 0)">
      <circle class="outline" cx="-4" cy="0" r="32"/>
      <path class="thin2" d="M-28 -12 C-8 -34 22 -28 30 0"/>
      <path class="thin2" d="M20 20 C0 36 -30 28 -36 0"/>
      <ellipse class="projectile" cx="84" cy="-24" rx="24" ry="8"/>
      <ellipse class="projectile" cx="130" cy="0" rx="26" ry="8"/>
      <ellipse class="projectile" cx="74" cy="24" rx="22" ry="8"/>
      <path class="thin2" d="M24 -24 L50 -24"/>
      <path class="thin2" d="M42 0 L92 0"/>
      <path class="thin2" d="M16 24 L44 24"/>
    </g>
  </g>

  <!-- 05 Melee monster: round, charge backward then dash right -->
  <g id="melee_monster_row" transform="translate(155 760)">
    <g id="melee_monster">
      <circle class="outline" cx="0" cy="0" r="72"/>
      <circle class="main" cx="0" cy="0" r="60"/>
      <polygon class="mid" points="0,-40 40,-14 28,40 -28,40 -40,-14"/>
      <circle class="outline" cx="18" cy="0" r="15"/>
    </g>
    <g id="melee_charge_ghost" transform="translate(170 0)">
      <ellipse class="mid" cx="-42" cy="0" rx="58" ry="44"/>
      <ellipse class="outline" cx="26" cy="0" rx="76" ry="52"/>
      <ellipse class="main" cx="34" cy="0" rx="60" ry="38"/>
      <polygon class="outline" points="98,-22 142,0 98,22"/>
      <path class="thin2" d="M-128 -24 L-72 -24"/>
      <path class="thin2" d="M-146 24 L-86 24"/>
    </g>
    <g id="melee_hit_effect" transform="translate(390 0)">
      <polygon class="outline" points="0,-46 22,-14 60,-22 34,0 60,22 22,14 0,46 -22,14 -60,22 -34,0 -60,-22 -22,-14"/>
      <polygon class="fx" points="0,-26 12,-8 34,-12 18,0 34,12 12,8 0,26 -12,8 -34,12 -18,0 -34,-12 -12,-8"/>
    </g>
  </g>

  <!-- 06 Ranged monster: rounded cone, charge scale then shoot right -->
  <g id="ranged_monster_row" transform="translate(875 760)">
    <g id="ranged_monster">
      <path class="outline" d="M-64 -58 C-34 -78 42 -42 88 0 C42 42 -34 78 -64 58 C-38 24 -38 -24 -64 -58 Z"/>
      <path class="main" d="M-44 -38 C-20 -52 34 -28 62 0 C34 28 -20 52 -44 38 C-26 16 -26 -16 -44 -38 Z"/>
      <circle class="outline" cx="-22" cy="0" r="17"/>
    </g>
    <g id="ranged_charge" transform="translate(155 0)">
      <ellipse class="outline" cx="0" cy="0" rx="64" ry="42"/>
      <ellipse class="main" cx="0" cy="0" rx="48" ry="28"/>
      <path class="thin2" d="M-92 -34 C-52 -58 20 -58 72 -28"/>
      <path class="thin2" d="M-92 34 C-52 58 20 58 72 28"/>
    </g>
    <g id="ranged_projectile" transform="translate(320 0)">
      <path class="projectile" d="M-28 -18 C0 -8 30 -4 62 0 C30 4 0 8 -28 18 Z"/>
      <path class="thin2" d="M-120 -20 L-54 -20"/>
      <path class="thin2" d="M-140 20 L-70 20"/>
    </g>
  </g>
</svg>
