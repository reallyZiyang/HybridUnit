<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#eef0f2"/>

  <!-- Recolorable top-down turrets v3.
       Goal: direction is unambiguous. All barrels point RIGHT in this sheet.
       Barrel rule: heavy rear hub near center, narrow/marked muzzle at front. -->

  <defs>
    <style>
      .outline { fill: #171b20; }
      .main { fill: #e7ecef; }
      .mid { fill: #9ca6ae; }
      .darkmid { fill: #59636c; }
    </style>
  </defs>

  <!-- 01 Gatling: front muzzle block on the right -->
  <g id="turret_gatling_v3" transform="translate(170 170)">
    <g id="base">
      <circle class="outline" cx="0" cy="0" r="88"/>
      <circle class="main" cx="0" cy="0" r="74"/>
      <polygon class="mid" points="0,-52 48,-26 48,34 0,60 -48,34 -48,-26"/>
      <circle class="outline" cx="0" cy="0" r="24"/>
    </g>
    <g id="barrel">
      <rect class="outline" x="-26" y="-34" width="52" height="68" rx="8"/>
      <rect class="darkmid" x="-12" y="-24" width="24" height="48" rx="4"/>
      <rect class="outline" x="18" y="-25" width="88" height="18" rx="3"/>
      <rect class="outline" x="18" y="7" width="88" height="18" rx="3"/>
      <rect class="mid" x="28" y="-19" width="58" height="6" rx="2"/>
      <rect class="mid" x="28" y="13" width="58" height="6" rx="2"/>
      <rect class="outline" x="96" y="-32" width="28" height="64" rx="4"/>
      <polygon class="mid" points="124,-26 144,-14 144,14 124,26"/>
    </g>
  </g>

  <!-- 02 Cannon: wide rear, distinct muzzle cap on right -->
  <g id="turret_cannon_v3" transform="translate(430 170)">
    <g id="base">
      <polygon class="outline" points="0,-92 66,-66 92,0 66,66 0,92 -66,66 -92,0 -66,-66"/>
      <polygon class="main" points="0,-76 54,-54 76,0 54,54 0,76 -54,54 -76,0 -54,-54"/>
      <circle class="mid" cx="0" cy="0" r="46"/>
      <circle class="outline" cx="0" cy="0" r="24"/>
    </g>
    <g id="barrel">
      <rect class="outline" x="-30" y="-40" width="58" height="80" rx="10"/>
      <rect class="darkmid" x="-16" y="-28" width="32" height="56" rx="5"/>
      <rect class="outline" x="18" y="-30" width="88" height="60" rx="8"/>
      <rect class="main" x="28" y="-20" width="58" height="40" rx="5"/>
      <rect class="outline" x="98" y="-24" width="34" height="48" rx="4"/>
      <rect class="mid" x="108" y="-12" width="12" height="24" rx="2"/>
    </g>
  </g>

  <!-- 03 Rail: arrow-like front emitter on right -->
  <g id="turret_rail_v3" transform="translate(690 170)">
    <g id="base">
      <circle class="outline" cx="0" cy="0" r="86"/>
      <rect class="main" x="-60" y="-60" width="120" height="120" rx="10"/>
      <rect class="mid" x="-38" y="-38" width="76" height="76" rx="6"/>
      <circle class="outline" cx="0" cy="0" r="22"/>
    </g>
    <g id="barrel">
      <rect class="outline" x="-24" y="-30" width="54" height="60" rx="8"/>
      <rect class="darkmid" x="-10" y="-20" width="26" height="40" rx="4"/>
      <rect class="outline" x="22" y="-22" width="84" height="44" rx="6"/>
      <rect class="main" x="34" y="-12" width="50" height="24" rx="3"/>
      <polygon class="outline" points="104,-34 146,0 104,34"/>
      <circle class="mid" cx="108" cy="0" r="13"/>
    </g>
  </g>

  <!-- 04 Rocket: two pods with front triangular nose on right -->
  <g id="turret_rocket_v3" transform="translate(950 170)">
    <g id="base">
      <polygon class="outline" points="0,-90 76,-46 76,46 0,90 -76,46 -76,-46"/>
      <polygon class="main" points="0,-74 62,-36 62,36 0,74 -62,36 -62,-36"/>
      <polygon class="mid" points="0,-44 38,-22 38,24 0,46 -38,24 -38,-22"/>
      <circle class="outline" cx="0" cy="0" r="22"/>
    </g>
    <g id="barrel">
      <rect class="outline" x="-24" y="-42" width="42" height="84" rx="7"/>
      <rect class="darkmid" x="-12" y="-28" width="18" height="56" rx="3"/>
      <rect class="outline" x="12" y="-38" width="82" height="32" rx="6"/>
      <rect class="outline" x="12" y="6" width="82" height="32" rx="6"/>
      <rect class="main" x="24" y="-28" width="46" height="12" rx="3"/>
      <rect class="main" x="24" y="16" width="46" height="12" rx="3"/>
      <polygon class="outline" points="90,-38 126,-22 90,-6"/>
      <polygon class="outline" points="90,6 126,22 90,38"/>
    </g>
  </g>

  <!-- Monsters retained as recolorable single-part references -->
  <g id="monster_disk" transform="translate(210 445)">
    <circle class="outline" cx="0" cy="0" r="76"/>
    <circle class="main" cx="0" cy="0" r="64"/>
    <polygon class="mid" points="0,-42 42,-14 28,42 -28,42 -42,-14"/>
    <circle class="outline" cx="0" cy="0" r="18"/>
  </g>

  <g id="monster_hex" transform="translate(470 445)">
    <polygon class="outline" points="0,-78 68,-40 68,40 0,78 -68,40 -68,-40"/>
    <polygon class="main" points="0,-64 56,-32 56,32 0,64 -56,32 -56,-32"/>
    <polygon class="mid" points="-28,-34 38,-26 42,34 -34,42 -48,-8"/>
    <rect class="outline" x="-16" y="-16" width="32" height="32" rx="3"/>
  </g>

  <g id="monster_blob" transform="translate(730 445)">
    <path class="outline" d="M-76 26 C-66 -48 -12 -82 48 -56 C88 -38 94 22 58 58 C12 86 -54 70 -76 26 Z"/>
    <path class="main" d="M-62 22 C-54 -36 -10 -62 38 -42 C70 -28 76 18 48 46 C12 66 -40 56 -62 22 Z"/>
    <path class="mid" d="M-28 12 C-24 -20 6 -34 32 -20 C48 -12 50 14 30 28 C10 40 -20 34 -28 12 Z"/>
    <circle class="outline" cx="4" cy="4" r="15"/>
  </g>

  <g id="monster_square" transform="translate(990 445)">
    <rect class="outline" x="-72" y="-72" width="144" height="144" rx="12"/>
    <rect class="main" x="-58" y="-58" width="116" height="116" rx="8"/>
    <polygon class="mid" points="-28,-38 42,-26 34,42 -38,32"/>
    <circle class="outline" cx="0" cy="0" r="18"/>
  </g>
</svg>
