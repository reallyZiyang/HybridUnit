<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <rect width="1400" height="420" fill="#eef0f2"/>

  <!-- Shared note: pure flat side-view turret concepts. No gradients, no shadows, no 3D. -->

  <!-- 01 Gatling turret: parts = base / body / barrel_cluster / muzzle_flash -->
  <g id="gatling_turret" transform="translate(145 230)">
    <ellipse cx="0" cy="76" rx="104" ry="22" fill="#151b21"/>
    <rect x="-92" y="36" width="184" height="46" rx="6" fill="#27313b" stroke="#11171d" stroke-width="7"/>
    <polygon points="-66,36 -34,0 48,0 78,36" fill="#354351" stroke="#11171d" stroke-width="7"/>
    <rect x="-108" y="-18" width="118" height="16" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
    <rect x="-112" y="2" width="126" height="16" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
    <rect x="-108" y="22" width="118" height="16" rx="3" fill="#222b33" stroke="#11171d" stroke-width="5"/>
    <rect x="8" y="-10" width="44" height="38" rx="4" fill="#4a5a6b" stroke="#11171d" stroke-width="5"/>
    <polygon points="-142,-4 -120,-18 -120,32 -142,18" fill="#53bfd3"/>
  </g>

  <!-- 02 Grenade turret: parts = base / body / cannon / muzzle_flash -->
  <g id="grenade_turret" transform="translate(425 230)">
    <ellipse cx="0" cy="76" rx="104" ry="22" fill="#191a13"/>
    <rect x="-92" y="38" width="184" height="44" rx="6" fill="#343829" stroke="#15170f" stroke-width="7"/>
    <polygon points="-62,38 -34,2 56,2 82,38" fill="#4a5036" stroke="#15170f" stroke-width="7"/>
    <rect x="-120" y="-12" width="136" height="44" rx="8" fill="#313526" stroke="#15170f" stroke-width="7"/>
    <rect x="-28" y="-28" width="72" height="74" rx="7" fill="#5d6442" stroke="#15170f" stroke-width="6"/>
    <rect x="-142" y="-2" width="30" height="24" rx="3" fill="#c6a23a" stroke="#15170f" stroke-width="5"/>
  </g>

  <!-- 03 Laser turret: parts = base / body / emitter / beam_anchor -->
  <g id="laser_turret" transform="translate(705 230)">
    <ellipse cx="0" cy="76" rx="98" ry="22" fill="#151622"/>
    <rect x="-84" y="40" width="168" height="42" rx="6" fill="#262b40" stroke="#11131c" stroke-width="7"/>
    <polygon points="-52,40 -24,8 56,8 78,40" fill="#343a56" stroke="#11131c" stroke-width="7"/>
    <rect x="-112" y="-8" width="118" height="34" rx="6" fill="#252a3f" stroke="#11131c" stroke-width="7"/>
    <rect x="-18" y="-20" width="56" height="58" rx="5" fill="#444c70" stroke="#11131c" stroke-width="6"/>
    <circle cx="-112" cy="9" r="19" fill="#46d7ff" stroke="#11131c" stroke-width="6"/>
    <circle cx="-112" cy="9" r="7" fill="#e6fbff"/>
  </g>

  <!-- 04 Tesla turret: parts = base / body / coil / spark -->
  <g id="tesla_turret" transform="translate(985 230)">
    <ellipse cx="0" cy="76" rx="96" ry="22" fill="#17151e"/>
    <rect x="-84" y="40" width="168" height="42" rx="6" fill="#2d293b" stroke="#121019" stroke-width="7"/>
    <polygon points="-52,40 -26,0 52,0 78,40" fill="#3c3650" stroke="#121019" stroke-width="7"/>
    <rect x="-20" y="-58" width="40" height="86" rx="5" fill="#2a2738" stroke="#121019" stroke-width="6"/>
    <rect x="-42" y="-50" width="84" height="16" rx="3" fill="#5d5276" stroke="#121019" stroke-width="5"/>
    <rect x="-42" y="-22" width="84" height="16" rx="3" fill="#5d5276" stroke="#121019" stroke-width="5"/>
    <circle cx="0" cy="-74" r="24" fill="#9b6dff" stroke="#121019" stroke-width="6"/>
    <polygon points="-52,-88 -30,-96 -36,-74" fill="#d3c3ff"/>
    <polygon points="48,-92 30,-104 32,-78" fill="#d3c3ff"/>
  </g>

  <!-- 05 Rocket turret: parts = base / body / launcher / rocket_flash -->
  <g id="rocket_turret" transform="translate(1265 230)">
    <ellipse cx="0" cy="76" rx="104" ry="22" fill="#1a1715"/>
    <rect x="-92" y="38" width="184" height="44" rx="6" fill="#3a332d" stroke="#171310" stroke-width="7"/>
    <polygon points="-58,38 -30,4 58,4 86,38" fill="#55483e" stroke="#171310" stroke-width="7"/>
    <rect x="-118" y="-28" width="132" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
    <rect x="-112" y="8" width="126" height="28" rx="5" fill="#302a25" stroke="#171310" stroke-width="6"/>
    <rect x="8" y="-22" width="50" height="52" rx="5" fill="#665548" stroke="#171310" stroke-width="6"/>
    <polygon points="-150,-18 -126,-32 -126,-4" fill="#ef7845"/>
    <polygon points="-148,18 -126,4 -126,32" fill="#efb245"/>
  </g>
</svg>
