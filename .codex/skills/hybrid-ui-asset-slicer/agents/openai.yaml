interface:
  display_name: "Hybrid UI Asset Slicer"
  short_description: "Generate and slice textless prototype UI and battle sprites."
  default_prompt: "Use $hybrid-ui-asset-slicer to generate a chroma-green textless asset sheet from the provided reference mockup, slice transparent PNGs into UI_Mockups/AssetSlices_Prototype, split progress bars into bg/fill layers, reject unintended baked text, and validate the output. Use Unity TMP for normal UI text; only explicit title-art exceptions may contain lettering. Put outputs with either dimension greater than 1024px under Assets/Res/UI/Common/Sprites/Large/."

policy:
  allow_implicit_invocation: true
